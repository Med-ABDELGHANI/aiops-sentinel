apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-server
  namespace: aiops-sentinel
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rag-server
  template:
    metadata:
      labels:
        app: rag-server
    spec:
      containers:
        - name: rag-server
          image: localhost/rag-server:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8002
          env:
            - name: QDRANT_HOST
              value: "qdrant"
            - name: QDRANT_PORT
              value: "6333"
            - name: QDRANT_COLLECTION
              value: "ansible_docs"
            - name: EMBEDDING_MODEL
              value: "all-MiniLM-L6-v2"
