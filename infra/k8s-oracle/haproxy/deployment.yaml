apiVersion: apps/v1
kind: Deployment
metadata:
  name: haproxy
  namespace: aiops-sentinel
spec:
  replicas: 1
  selector:
    matchLabels:
      app: haproxy
  template:
    metadata:
      labels:
        app: haproxy
    spec:
      containers:
        - name: haproxy
          image: docker.io/library/haproxy:2.9-alpine
          ports:
            - containerPort: 80
              hostPort: 80
            - containerPort: 443
              hostPort: 443
          volumeMounts:
            - name: haproxy-config-volume
              mountPath: /usr/local/etc/haproxy/haproxy.cfg
              subPath: haproxy.cfg
            - name: tls-cert-volume
              mountPath: /usr/local/etc/haproxy/certs
              readOnly: true
      volumes:
        - name: haproxy-config-volume
          configMap:
            name: haproxy-config
        - name: tls-cert-volume
          hostPath:
            path: /etc/letsencrypt/live/aiops-sentinel.duckdns.org
            type: Directory
